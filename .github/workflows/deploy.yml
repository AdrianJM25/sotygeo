name: Desplegar a IONOS

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Despliegue SFTP a IONOS
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obtener el código más reciente
      uses: actions/checkout@v4

    - name: 📦 Instalar dependencias PHP (Composer)
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - run: composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist

    - name: 📂 Sincronizar archivos con IONOS (SFTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: sftp
        port: 22
        server-dir: / # Cambia esto a /sotygeo/ si configuraste el dominio hacia una carpeta
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env.example
          .env
          phpunit.xml
          tests/**